<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 6" width="1280" height="6" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#86a8f2" stop-opacity="0"/><stop offset=".5" stop-color="#86a8f2"/><stop offset="1" stop-color="#e8c766" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    .run { animation: run 5.5s ease-in-out infinite; }
    @keyframes run { 0% { transform: translateX(-420px); } 100% { transform: translateX(1280px); } }
    @media (prefers-reduced-motion: reduce) { .run { animation: none; transform: translateX(430px); } }
  </style>
  <rect y="2" width="1280" height="1" fill="#2a3340" opacity=".55"/>
  <rect class="run" y="1" width="420" height="3" rx="1.5" fill="url(#g)"/>
</svg>
